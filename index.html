<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Lasaña</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Calculadora de Lasaña</h1>

        <div class="form-group">
            <label for="capas">Capas de lasaña:</label>
            <input type="number" id="capas" placeholder="Ej: 5">
        </div>

        <div class="form-group">
            <label for="horno">Minutos en el horno:</label>
            <input type="number" id="horno" placeholder="Ej: 20">
        </div>

        <button id="btnCalcular">Calcular</button>

        <div id="resultados">
            <p id="restante"></p>
            <p id="preparacion"></p>
            <p id="total"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
